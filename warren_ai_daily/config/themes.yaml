# Warren AI — User-Defined Theme Registry
# Edit freely. Themes are an OVERLAY on top of classic SPDR sectors.
# A ticker retains its classic sector (XLK, XLC, XLE, etc.) regardless of theme tags.
# A ticker may belong to many themes simultaneously.
#
# Structure:
#   themes:
#     Theme Name:
#       description: "Short description of the theme."
#       tickers:
#         TICKER: "Short rationale for inclusion"

themes:

  AI Infrastructure:
    description: "Companies exposed to AI compute, chips, servers, networking, cloud, and data center power demand."
    tickers:
      NVDA: "AI GPUs and systems — dominant AI compute"
